<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111d28">
  <meta name="description" content="Safe Screen is a family-focused phone interface prototype with curated browsing and parent-managed settings.">
  <meta name="color-scheme" content="dark light">
  <title>Safe Screen</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #101a24;
      --bg-soft: #152431;
      --panel: rgba(28, 44, 57, .88);
      --panel-solid: #1b2b39;
      --panel-2: #223746;
      --line: rgba(214, 232, 239, .12);
      --text: #f1f6f7;
      --muted: #a4b7c0;
      --muted-2: #7f98a4;
      --accent: #b8eddb;
      --accent-ink: #153a35;
      --blue: #b3d6f7;
      --orange: #f2c79a;
      --danger: #f3b0a9;
      --good: #a7e2bd;
      --shadow: 0 24px 70px rgba(0, 0, 0, .22);
      --radius-xl: 30px;
      --radius-lg: 23px;
      --radius-md: 17px;
      --radius-sm: 12px;
      --ease: cubic-bezier(.2,.75,.25,1);
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f3f4ee;
      --bg-soft: #e8ece6;
      --panel: rgba(255,255,253,.86);
      --panel-solid: #fffefa;
      --panel-2: #edf2ed;
      --line: rgba(26, 47, 56, .12);
      --text: #1b2a31;
      --muted: #52676f;
      --muted-2: #73858a;
      --accent: #205c51;
      --accent-ink: #f4fff9;
      --blue: #d3e6f6;
      --orange: #f7e0ca;
      --danger: #9f3b35;
      --good: #236c43;
      --shadow: 0 24px 70px rgba(42, 57, 48, .10);
    }
    @media (prefers-color-scheme: light) {
      html[data-theme="system"] {
        color-scheme: light;
        --bg: #f3f4ee; --bg-soft: #e8ece6; --panel: rgba(255,255,253,.86); --panel-solid: #fffefa; --panel-2: #edf2ed;
        --line: rgba(26, 47, 56, .12); --text: #1b2a31; --muted: #52676f; --muted-2: #73858a; --accent: #205c51; --accent-ink: #f4fff9;
        --blue: #d3e6f6; --orange: #f7e0ca; --danger: #9f3b35; --good: #236c43; --shadow: 0 24px 70px rgba(42, 57, 48, .10);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: ui-rounded, "SF Pro Rounded", "Nunito Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100dvh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .ambient { pointer-events: none; position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at 85% 10%, rgba(91, 155, 148, .13), transparent 35%), radial-gradient(ellipse at 3% 68%, rgba(101, 140, 174, .11), transparent 31%); }
    .app-frame { position: relative; isolation: isolate; z-index: 1; width: 100%; min-height: 100dvh; max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    @media (min-width: 760px) {
      body { padding: 22px; }
      .app-frame { min-height: calc(100dvh - 44px); border: 1px solid var(--line); border-radius: 34px; overflow: hidden; background: color-mix(in srgb, var(--bg) 91%, transparent); box-shadow: var(--shadow); }
      .ambient { position: fixed; }
    }
    .topbar { min-height: 64px; padding: 11px 22px 10px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom: 1px solid var(--line); flex-shrink:0; }
    .brand-wrap { display:flex; align-items:center; gap:11px; min-width:0; }
    .brand-mark { width:38px; height:38px; border-radius:14px; display:grid; place-items:center; background:var(--accent); color:var(--accent-ink); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); flex-shrink:0; }
    .brand-mark svg { width:23px; height:23px; }
    .brand-name { line-height:1.08; font-size:15px; font-weight:800; letter-spacing:-.04em; }
    .brand-tagline { color:var(--muted); font-size:10px; margin-top:4px; letter-spacing:.07em; text-transform:uppercase; }
    .top-actions { display:flex; align-items:center; gap:8px; }
    .status-pill { display:flex; align-items:center; gap:7px; background:var(--panel); border:1px solid var(--line); padding:8px 11px; border-radius:999px; font-size:11px; color:var(--muted); white-space:nowrap; }
    .status-dot { width:7px; height:7px; border-radius:50%; background:var(--good); box-shadow:0 0 0 4px color-mix(in srgb, var(--good) 15%, transparent); }
    .icon-button { width:38px; height:38px; border-radius:13px; display:grid; place-items:center; background:var(--panel); border:1px solid var(--line); cursor:pointer; transition:transform .2s var(--ease), background .2s; }
    .icon-button:hover { transform:translateY(-2px); background:var(--panel-2); }
    .icon-button svg { width:18px; height:18px; }
    .main { flex:1; min-height:0; padding:22px 20px 24px; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
    .bottom-nav { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:9px 15px calc(8px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(18px); flex-shrink:0; }
    .nav-item { border:0; background:transparent; cursor:pointer; border-radius:15px; min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--muted); font-size:10px; font-weight:700; transition:background .2s, color .2s, transform .2s var(--ease); }
    .nav-item svg { width:20px; height:20px; }
    .nav-item.active { color:var(--text); background:var(--panel-2); }
    .nav-item:active { transform:scale(.96); }
    .view-enter { animation:riseIn .34s var(--ease) both; }
    @keyframes riseIn { from { opacity:0; transform:translateY(9px) scale(.992); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes breathe { 0%,100% { transform:scale(1); } 50% { transform:scale(1.025); } }
    @keyframes drift { from { transform:translateY(0); } to { transform:translateY(-7px); } }
    .eyebrow { color:var(--muted-2); font-size:10px; text-transform:uppercase; letter-spacing:.15em; font-weight:800; margin:0 0 10px; }
    h1,h2,h3,p { margin-top:0; }
    h1 { font-size:clamp(29px, 7vw, 42px); line-height:1.02; letter-spacing:-.06em; margin-bottom:13px; font-weight:800; }
    h2 { font-size:21px; letter-spacing:-.04em; margin-bottom:9px; line-height:1.14; }
    h3 { font-size:15px; letter-spacing:-.025em; margin-bottom:7px; }
    p { color:var(--muted); font-size:14px; line-height:1.55; }
    .lead { font-size:15px; max-width:39ch; }
    .muted { color:var(--muted); }
    .tiny { font-size:11px; line-height:1.5; }
    .micro { font-size:10px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px; box-shadow:0 8px 28px rgba(0,0,0,.035); }
    .card + .card { margin-top:12px; }
    .hero-card { position:relative; overflow:hidden; border-radius:27px; padding:23px; background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--panel-solid)), var(--panel)); border:1px solid var(--line); }
    .hero-card:after { content:""; position:absolute; width:156px; height:156px; right:-41px; top:-37px; border-radius:50%; border:1px solid color-mix(in srgb,var(--accent) 25%, transparent); box-shadow:0 0 0 20px color-mix(in srgb,var(--accent) 4%,transparent), 0 0 0 42px color-mix(in srgb,var(--accent) 3%,transparent); }
    .hero-art { position:absolute; right:22px; top:25px; width:56px; height:56px; border-radius:19px; display:grid; place-items:center; background:var(--accent); color:var(--accent-ink); z-index:1; animation:breathe 4s ease-in-out infinite; }
    .hero-art svg { width:29px; height:29px; }
    .hero-card h1 { max-width:8ch; font-size:clamp(30px, 8vw, 40px); margin:11px 0 10px; }
    .hero-card p { max-width:31ch; margin-bottom:17px; }
    .chip { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:999px; padding:7px 10px; color:var(--muted); background:color-mix(in srgb,var(--panel-solid) 63%,transparent); font-size:10px; font-weight:800; letter-spacing:.03em; }
    .chip .small-dot { width:6px; height:6px; border-radius:50%; background:var(--good); }
    .section-heading { display:flex; align-items:end; justify-content:space-between; gap:10px; margin:24px 2px 12px; }
    .section-heading h2 { margin:0; font-size:18px; }
    .text-link { border:0; background:transparent; color:var(--accent); cursor:pointer; font-size:12px; font-weight:800; padding:6px 0; }
    .app-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .app-tile { min-width:0; border:1px solid var(--line); border-radius:20px; background:var(--panel); padding:14px 8px 12px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:9px; cursor:pointer; transition:transform .22s var(--ease), background .22s, border-color .22s; }
    .app-tile:hover { transform:translateY(-3px); background:var(--panel-2); border-color:color-mix(in srgb,var(--accent) 38%,var(--line)); }
    .app-tile:active { transform:scale(.97); }
    .app-symbol { width:48px; height:48px; border-radius:17px; display:grid; place-items:center; flex-shrink:0; }
    .app-symbol svg { width:23px; height:23px; }
    .tone-mint { background:color-mix(in srgb,#b8eddb 23%,var(--panel-solid)); color:var(--accent); }
    .tone-blue { background:color-mix(in srgb,#b3d6f7 33%,var(--panel-solid)); color:#6eaddb; }
    .tone-peach { background:color-mix(in srgb,#f2c79a 28%,var(--panel-solid)); color:#d2945a; }
    .tone-lilac { background:color-mix(in srgb,#d3c5f6 24%,var(--panel-solid)); color:#af9be8; }
    .tone-rose { background:color-mix(in srgb,#f1c4c1 28%,var(--panel-solid)); color:#db928a; }
    .app-title { font-size:12px; font-weight:800; letter-spacing:-.02em; line-height:1.2; }
    .app-caption { font-size:10px; color:var(--muted); line-height:1.25; }
    .split-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .metric-card { padding:16px; border-radius:20px; background:var(--panel); border:1px solid var(--line); min-width:0; }
    .metric-label { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--muted); margin-bottom:12px; }
    .metric-label svg { width:15px; height:15px; }
    .metric-value { font-size:24px; letter-spacing:-.05em; font-weight:800; line-height:1; }
    .metric-sub { margin-top:7px; font-size:10px; color:var(--muted); }
    .progress-track { height:6px; border-radius:999px; background:var(--line); margin-top:15px; overflow:hidden; }
    .progress-fill { height:100%; border-radius:999px; background:var(--accent); width:0; transition:width .45s var(--ease); }
    .action-button { min-height:46px; padding:12px 17px; border-radius:15px; border:1px solid transparent; background:var(--accent); color:var(--accent-ink); font-size:13px; font-weight:850; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:9px; transition:transform .2s var(--ease), filter .2s; }
    .action-button:hover { filter:brightness(1.06); transform:translateY(-1px); }
    .action-button:active { transform:scale(.98); }
    .action-button svg { width:17px; height:17px; }
    .action-button.secondary { border-color:var(--line); background:var(--panel-2); color:var(--text); }
    .action-button.ghost { border-color:var(--line); background:transparent; color:var(--text); }
    .action-button.danger { background:color-mix(in srgb,var(--danger) 18%,var(--panel-solid)); border-color:color-mix(in srgb,var(--danger) 34%,var(--line)); color:var(--danger); }
    .action-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:18px; }
    .action-row .action-button { flex:1; }
    .field { display:flex; flex-direction:column; gap:8px; margin:14px 0; }
    .field label, .field-label { font-size:12px; font-weight:800; color:var(--text); }
    .field .hint { font-size:11px; color:var(--muted); line-height:1.45; }
    .text-input, .select-input, .textarea-input { width:100%; min-height:48px; border:1px solid var(--line); border-radius:14px; background:var(--bg-soft); color:var(--text); padding:12px 14px; font-size:14px; outline:none; }
    .text-input::placeholder, .textarea-input::placeholder { color:var(--muted-2); }
    .text-input.pin-field { font-size:21px; letter-spacing:.28em; text-align:center; font-variant-numeric:tabular-nums; }
    .textarea-input { min-height:140px; resize:vertical; line-height:1.5; }
    .form-error { min-height:18px; color:var(--danger); font-size:12px; line-height:1.4; margin-top:7px; }
    .setup-wrap { display:flex; flex-direction:column; justify-content:center; min-height:calc(100dvh - 166px); padding:10px 0 25px; }
    .setup-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
    .step-track { display:flex; gap:5px; flex:1; margin-left:16px; }
    .step-segment { height:4px; border-radius:999px; flex:1; background:var(--line); transition:background .3s; }
    .step-segment.active { background:var(--accent); }
    .setup-illustration { width:96px; height:96px; border-radius:31px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; margin:7px 0 27px; box-shadow:0 18px 46px color-mix(in srgb,var(--accent) 12%,transparent); }
    .setup-illustration svg { width:48px; height:48px; }
    .setup-content { max-width:460px; width:100%; margin:0 auto; }
    .setup-content h1 { max-width:10ch; }
    .setup-content .lead { max-width:36ch; }
    .setup-note { display:flex; align-items:flex-start; gap:10px; padding:13px; margin-top:16px; border-radius:15px; background:var(--panel); border:1px solid var(--line); }
    .setup-note svg { flex-shrink:0; width:17px; height:17px; color:var(--accent); margin-top:2px; }
    .setup-note p { font-size:11px; margin:0; line-height:1.5; }
    .choice-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:21px 0; }
    .choice-card { text-align:left; border:1px solid var(--line); border-radius:19px; background:var(--panel); padding:16px; cursor:pointer; transition:border-color .2s, transform .2s; }
    .choice-card.selected { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
    .choice-card:hover { transform:translateY(-2px); }
    .choice-visual { height:52px; border-radius:13px; border:1px solid var(--line); margin-bottom:12px; overflow:hidden; display:flex; flex-direction:column; padding:7px; gap:5px; }
    .choice-visual.dark { background:#162430; }
    .choice-visual.light { background:#f4f5ef; }
    .choice-visual span { height:7px; width:55%; border-radius:9px; background:#71998e; }
    .choice-visual i { height:14px; width:100%; border-radius:6px; background:rgba(181,236,218,.23); }
    .choice-visual.light span { background:#42776d; }
    .choice-visual.light i { background:#dcebe5; }
    .choice-title { font-weight:800; font-size:13px; margin-bottom:4px; }
    .choice-sub { font-size:10px; color:var(--muted); }
    .setup-footer { margin-top:28px; }
    .setup-footer .action-button { width:100%; }
    .lock-screen { min-height:calc(100dvh - 160px); display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:12px 0 35px; }
    .lock-logo { width:80px; height:80px; border-radius:27px; display:grid; place-items:center; background:var(--accent); color:var(--accent-ink); margin-bottom:26px; animation:breathe 5s ease-in-out infinite; }
    .lock-logo svg { width:38px; height:38px; }
    .lock-screen h1 { font-size:34px; max-width:11ch; margin:0 auto 12px; }
    .lock-screen p { max-width:30ch; }
    .lock-form { width:min(100%,340px); margin:20px auto 0; }
    .lock-form .action-button { width:100%; }
    .page-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin:3px 1px 21px; }
    .page-heading h1 { font-size:31px; margin-bottom:7px; }
    .page-heading p { font-size:13px; margin:0; }
    .section-icon { width:44px; height:44px; display:grid; place-items:center; border-radius:16px; flex-shrink:0; background:var(--panel-2); border:1px solid var(--line); }
    .section-icon svg { width:22px; height:22px; }
    .feature-row { display:flex; align-items:center; gap:12px; }
    .feature-row + .feature-row { margin-top:17px; padding-top:17px; border-top:1px solid var(--line); }
    .feature-icon { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; flex-shrink:0; background:var(--panel-2); }
    .feature-icon svg { width:19px; height:19px; }
    .feature-copy { min-width:0; flex:1; }
    .feature-copy h3 { font-size:13px; margin:0 0 4px; }
    .feature-copy p { font-size:11px; line-height:1.4; margin:0; }
    .switch { width:43px; height:26px; border-radius:999px; border:1px solid var(--line); background:var(--panel-2); padding:3px; flex-shrink:0; cursor:pointer; transition:background .2s; }
    .switch:after { content:""; display:block; width:18px; height:18px; border-radius:50%; background:var(--muted); transition:transform .2s var(--ease), background .2s; }
    .switch.on { background:var(--accent); border-color:transparent; }
    .switch.on:after { transform:translateX(17px); background:var(--accent-ink); }
    .switch[aria-checked="true"] { background:var(--accent); }
    .settings-tabs { display:flex; gap:7px; overflow-x:auto; margin:-3px 0 16px; padding:2px 0 7px; scrollbar-width:none; }
    .settings-tabs::-webkit-scrollbar { display:none; }
    .tab-button { flex-shrink:0; border:1px solid var(--line); background:var(--panel); padding:9px 13px; border-radius:999px; color:var(--muted); font-weight:800; font-size:11px; cursor:pointer; }
    .tab-button.active { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
    .setting-row { display:flex; align-items:center; gap:13px; min-height:60px; padding:14px 0; }
    .setting-row + .setting-row { border-top:1px solid var(--line); }
    .setting-copy { flex:1; min-width:0; }
    .setting-copy strong { font-size:13px; display:block; margin-bottom:4px; }
    .setting-copy span { display:block; font-size:11px; color:var(--muted); line-height:1.45; }
    .setting-control { flex-shrink:0; }
    .setting-select { border:1px solid var(--line); color:var(--text); background:var(--bg-soft); padding:9px 10px; border-radius:11px; font-size:12px; max-width:135px; }
    .site-row { display:flex; align-items:center; gap:11px; padding:12px 0; }
    .site-row + .site-row { border-top:1px solid var(--line); }
    .site-favicon { width:36px; height:36px; border-radius:12px; background:var(--panel-2); display:grid; place-items:center; font-weight:900; font-size:13px; color:var(--accent); flex-shrink:0; }
    .site-details { min-width:0; flex:1; }
    .site-details strong { display:block; font-size:12px; margin-bottom:3px; }
    .site-details span { display:block; color:var(--muted); font-size:10px; overflow-wrap:anywhere; }
    .remove-button { border:1px solid var(--line); background:transparent; color:var(--danger); width:31px; height:31px; border-radius:10px; font-size:18px; cursor:pointer; }
    .browser-search { display:flex; align-items:center; gap:8px; padding:6px; border-radius:17px; border:1px solid var(--line); background:var(--panel); margin-bottom:17px; }
    .browser-search svg { width:18px; height:18px; color:var(--muted); margin-left:8px; flex-shrink:0; }
    .browser-search input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--text); padding:10px 0; font-size:13px; }
    .browser-search button { background:var(--accent); color:var(--accent-ink); border:0; padding:10px 12px; border-radius:12px; font-weight:850; font-size:11px; cursor:pointer; }
    .browser-banner { background:linear-gradient(130deg, color-mix(in srgb,#b3d6f7 20%,var(--panel-solid)),var(--panel)); border:1px solid var(--line); border-radius:23px; padding:18px; margin-bottom:22px; display:flex; align-items:center; gap:15px; }
    .browser-banner-icon { width:52px; height:52px; border-radius:18px; background:var(--blue); color:#264b6b; display:grid; place-items:center; flex-shrink:0; }
    .browser-banner-icon svg { width:26px; height:26px; }
    .browser-banner h2 { margin:0 0 6px; font-size:17px; }
    .browser-banner p { font-size:11px; margin:0; line-height:1.45; }
    .site-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .site-card { min-width:0; border:1px solid var(--line); background:var(--panel); border-radius:18px; padding:14px; cursor:pointer; text-align:left; transition:transform .2s var(--ease), border-color .2s; }
    .site-card:hover { transform:translateY(-2px); border-color:color-mix(in srgb,var(--accent) 45%,var(--line)); }
    .site-card .site-favicon { margin-bottom:11px; }
    .site-card h3 { font-size:13px; margin-bottom:5px; }
    .site-card p { font-size:10px; line-height:1.4; margin:0 0 11px; }

      if(setupStage===3) body=`<div class="setup-illustration">${icon(s.icon,46)}</div><p class="eyebrow">${s.eyebrow}</p><h1>${s.title}</h1><p class="lead">${s.desc}</p><form data-form="setup-parent" novalidate><div class="field"><label for="parent-pin">Parental access code</label><input class="text-input pin-field" id="parent-pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,10}" minlength="4" maxlength="10" autocomplete="new-password" placeholder="••••" required><span class="hint">4–10 numbers. It must be different from the Safe Screen unlock PIN.</span></div><div class="field"><label for="parent-pin-confirm">Confirm parental code</label><input class="text-input pin-field" id="parent-pin-confirm" name="confirm" type="password" inputmode="numeric" minlength="4" maxlength="10" autocomplete="new-password" placeholder="••••" required></div><div class="form-error" id="setup-parent-error" aria-live="polite"></div><button class="action-button" type="submit">Continue ${icon('arrow',16)}</button></form>`;
      if(setupStage===4) body=`<div class="setup-illustration">${icon(s.icon,46)}</div><p class="eyebrow">${s.eyebrow}</p><h1>${s.title}</h1><p class="lead">${s.desc}</p><div class="card" style="margin-top:18px"><div class="setting-row" style="padding-top:0"><div class="feature-icon">${icon('clock',19)}</div><div class="setting-copy"><strong>Daily time limit</strong><span>Counts time spent inside Safe Screen only in this prototype.</span></div><button class="switch ${setupDraft.timeLimitEnabled?'on':''}" data-action="toggle-setup-time" role="switch" aria-checked="${setupDraft.timeLimitEnabled}" aria-label="Enable daily time limit"></button></div>${setupDraft.timeLimitEnabled?`<div class="field"><label for="setup-limit">Daily allowance <strong id="setup-limit-label">${setupDraft.dailyLimitMinutes} minutes</strong></label><input id="setup-limit" type="range" min="30" max="240" step="15" value="${setupDraft.dailyLimitMinutes}" data-action="setup-limit-change" style="width:100%;accent-color:var(--accent)"><span class="hint">This timer is not device-wide and can be bypassed by leaving the web app.</span></div>`:''}<div class="setting-row"><div class="feature-icon">${icon('moon',19)}</div><div class="setting-copy"><strong>Bedtime pause</strong><span>Show a quiet-time screen during chosen hours.</span></div><button class="switch ${setupDraft.bedtimeEnabled?'on':''}" data-action="toggle-setup-bedtime" role="switch" aria-checked="${setupDraft.bedtimeEnabled}" aria-label="Enable bedtime pause"></button></div></div><div class="setup-note">${icon('alert',18)}<p>The setup helps organise this interface. Real iPhone-wide limits need Apple's approved Screen Time APIs in a native app.</p></div>`;

iv class="empty-state"><div class="section-icon">${icon('globe',22)}</div><h3>No approved sites yet</h3><p>Ask a parent to add a website to the approved list.</p></div>`:''}<div class="safe-callout">${icon('lock',18)}<p><strong>Curated by your family.</strong> If a site is not here, ask a parent to review it first. This prototype does not provide network-level filtering.</p></div>`}</div>`;

    }
    function settingsDevice() {
      return `<div class="card"><p class="eyebrow">Appearance</p><div class="setting-row" style="padding-top:0"><div class="feature-icon">${icon('sun',19)}</div><div class="setting-copy"><strong>Interface theme</strong><span>Change the colour atmosphere for this device.</span></div><select class="setting-select" data-setting="theme" aria-label="Interface theme"><option value="system" ${state.theme==='system'?'selected':''}>Device</option><option value="light" ${state.theme==='light'?'selected':''}>Light</option><option value="dark" ${state.theme==='dark'?'selected':''}>Dark</option></select></div></div><div class="card"><p class="eyebrow">Change unlock PIN</p><form data-form="change-device-pin"><div class="field"><label for="device-current-parent">Confirm parental code</label><input class="text-input pin-field" id="device-current-parent" name="parent" type="password" inputmode="numeric" minlength="4" maxlength="10" autocomplete="off" required></div><div class="field"><label for="new-device-pin">New Safe Screen unlock PIN</label><input class="text-input pin-field" id="new-device-pin" name="pin" type="password" inputmode="numeric" minlength="4" maxlength="10" autocomplete="new-password" required></div><div class="field"><label for="new-device-pin-confirm">Confirm new PIN</label><input class="text-input pin-field" id="new-device-pin-confirm" name="confirm" type="password" inputmode="numeric" minlength="4" maxlength="10" autocomplete="new-password" required></div><div class="form-error" id="change-device-error" aria-live="polite"></div><button class="action-button secondary" type="submit">Update unlock PIN</button></form></div><div class="card"><p class="eyebrow">Change parental code</p><form data-form="change-parent-pin"><div class="field"><label for="parent-current-device">Confirm Safe Screen unlock PIN</label><input class="text-input pin-field" id="parent-current-device" name="device" type="password" inputmode="numeric" minlength="4" maxlength="10" autocomplete="off" required></div><div class="field"><label for="new-parent-pin">New parental code</label><input class="text-input pin-field" id="new-parent-pin" name="pin" type="password" inputmode="numeric" minlength="4" maxlength="10" autocomplete="new-password" required></div><div class="field"><label for="new-parent-pin-confirm">Confirm new code</label><input class="text-input pin-field" id="new-parent-pin-confirm" name="confirm" type="password" inputmode="numeric" minlength="4" maxlength="10" autocomplete="new-password" required></div><div class="form-error" id="change-parent-error" aria-live="polite"></div><button class="action-button secondary" type="submit">Update parental code</button></form></div><div class="card"><p class="eyebrow">Prototype data</p><p class="tiny">Settings, PIN hashes, your journal, and approved website list are stored in this browser's local storage. They are not synced to another device or encrypted as a secure vault.</p><div class="action-row"><button class="action-button danger" data-action="reset-prototype">Reset Safe Screen</button></div></div>`;
    }
    function settingsScreen() {
      const tabs=[['safety','Safety'],['apps','Apps'],['schedule','Schedule'],['websites','Websites'],['device','Device']];
      let content = settingsTab==='safety'?settingsSafety():settingsTab==='apps'?settingsApps():settingsTab==='schedule'?settingsSchedule():settingsTab==='websites'?settingsWebsites():settingsDevice();
      return `<div class="view-enter">${pageHeading('Parent settings','Set the boundaries that work for your family.','settings')}<div class="settings-tabs" role="tablist">${tabs.map(([id,label])=>`<button class="tab-button ${settingsTab===id?'active':''}" data-action="settings-tab" data-tab="${id}" role="tab" aria-selected="${settingsTab===id}">${label}</button>`).join('')}</div>${content}<div class="legal-note">Safe Screen prototype · Controls apply inside this web interface only. Learn how to turn this into a native app in the project README.</div></div>`;
    }
    function timeLimitScreen(reason) {
      const bedtime=reason==='bedtime';
      return `<main class="main"><section class="limit-screen view-enter"><div class="limit-symbol">${icon(bedtime?'moon':'clock',40)}</div><p class="eyebrow">A little pause</p><h1>${bedtime?'It is quiet time.':'That is your time for today.'}</h1><p>${bedtime?'The bedtime pause is active. Take this chance to rest, read, or do something away from the screen.':'You have reached the time allowance set for Safe Screen. A parent can adjust the limit if needed.'}</p><div class="action-row" style="width:min(100%,330px)"><button class="action-button" data-action="ask-parent">Parent access ${icon('lock',16)}</button><button class="action-button ghost" data-action="leave-overlay">Okay</button></div><div class="legal-note" style="max-width:330px">This prototype measures only time within Safe Screen. It cannot lock the iPhone or block other apps.</div></section></main>`;
    }
    function renderModal() {
      if(!modal) return '';
      if(modal==='parent-gate') return `<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="parent-gate-title"><div class="modal-mark">${icon('lock',24)}</div><p class="eyebrow">Parent access</p><h2 id="parent-gate-title">Settings are protected.</h2><p>Enter the parental code to continue. This is separate from the Safe Screen unlock PIN.</p><form data-form="parent-gate" novalidate><div class="field"><label for="gate-pin">Parental code</label><input class="text-input pin-field" id="gate-pin" name="pin" type="password" inputmode="numeric" minlength="4" maxlength="10" autocomplete="current-password" required autofocus></div><div class="form-error">${esc(parentError)}</div><button class="action-button" type="submit">Open parent settings ${icon('arrow',16)}</button><button class="action-button ghost" type="button" data-action="close-modal" style="margin-top:9px">Cancel</button></form><div class="legal-note">PINs are hashed before being stored, but this client-side prototype is not tamper-proof.</div></section></div>`;
      if(modal==='reset-confirm') return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-title"><div class="modal-mark">${icon('alert',24)}</div><p class="eyebrow">Reset demo</p><h2 id="reset-title">Start over?</h2><p>This removes the Safe Screen setup, local settings, approved websites and journal saved in this browser.</p><div class="action-row"><button class="action-button danger" data-action="confirm-reset">Reset everything</button><button class="action-button ghost" data-action="close-modal">Keep settings</button></div></section></div>`;
      return '';
    }
    function render() {
      setTheme();
      updateUsageDay();
      const limited = getLimitReason();
      if(unlocked && !parentMode && limited && view!=='time-limit') view='time-limit';
      if(!unlocked && state.setupDone) view='lock';
      let body='';
      const isSetup=view==='setup' || !state.setupDone;
      const isLock=view==='lock' && state.setupDone && !unlocked;
      if(isSetup) body=setupScreen();
      else if(isLock) body=lockScreen();
      else if(view==='time-limit') body=timeLimitScreen(getLimitReason()||'limit');
      else if(view==='home') body=`<main class="main">${homeScreen()}</main>`;
      else if(view==='apps') body=`<main class="main">${appsScreen()}</main>`;
      else if(view==='browser') body=`<main class="main">${browserScreen()}</main>`;
      else if(view==='learn') body=`<main class="main">${learnScreen()}</main>`;
      else if(view==='read') body=`<main class="main">${readingScreen()}</main>`;
      else if(view==='calculator') body=`<main class="main">${calculatorScreen()}</main>`;
      else if(view==='journal') body=`<main class="main">${journalScreen()}</main>`;
      else if(view==='family') body=`<main class="main">${familyScreen()}</main>`;
      else if(view==='settings' && parentMode) body=`<main class="main">${settingsScreen()}</main>`;
      else { view=unlocked?'home':'lock'; body=unlocked?`<main class="main">${homeScreen()}</main>`:lockScreen(); }
      root.innerHTML=`${shellHeader()}${body}${!isSetup&&!isLock?bottomNav():''}${renderModal()}`;
      if(view==='lock') setTimeout(()=>$('#unlock-pin')?.focus({preventScroll:true}),30);
      if(modal==='parent-gate') setTimeout(()=>$('#gate-pin')?.focus({preventScroll:true}),30);
    }
    function navTo(target) {
      if(target==='settings') {
        if(parentMode) { view='settings'; render(); return; }
        modal='parent-gate'; parentError=''; render(); return;
      }
      if(parentMode && target!=='settings') parentMode=false;
      if(target==='browser' || target==='apps' || target==='home') currentBrowserSite=null;
      view=target; render();
    }
    function launchApp(id) {
      if(id==='settings') { navTo('settings'); return; }
      if(!state.controls.visibleApps[id]) { showToast('This app is hidden by parent settings.'); return; }
      currentBrowserSite=null;
      view=id; render();
    }
    async function setupForm(form, type) {
      const data = new FormData(form); const pin=String(data.get('pin')||''); const confirm=String(data.get('confirm')||'');
      const err = $('#'+(type==='device'?'setup-device-error':'setup-parent-error'));
      if(!validPin(pin)) { if(err) err.textContent='Use 4–10 digits, with no spaces or symbols.'; return; }
      if(pin!==confirm) { if(err) err.textContent='Those PIN entries do not match. Try again.'; return; }
      if(type==='device') {
        setupDraft.devicePin=pin; setupStage=3; render(); return;
      }
      if(pin===setupDraft.devicePin) { if(err) err.textContent='Choose a different code from the Safe Screen unlock PIN.'; return; }
      setupDraft.parentPin=pin; setupStage=4; render();
    }
    async function finishSetup() {
      state.theme=setupDraft.theme;
      state.devicePin=await makePinRecord(setupDraft.devicePin);
      state.parentPin=await makePinRecord(setupDraft.parentPin);
      state.controls.timeLimitEnabled=setupDraft.timeLimitEnabled;
      state.controls.dailyLimitMinutes=setupDraft.dailyLimitMinutes;
      state.controls.bedtimeEnabled=setupDraft.bedtimeEnabled;
      state.setupDone=true; state.usage={date:todayKey(),seconds:0};
      persist(); unlocked=true; unlockedPinValue=setupDraft.devicePin; parentMode=false; view='home'; setupDraft.devicePin=''; setupDraft.parentPin=''; render();
    }
    function isBedtime() { return getLimitReason()==='bedtime'; }
    function normalizeSiteUrl(input) {
      let url; try { url=new URL(input.trim()); } catch { try { url=new URL('https://'+input.trim()); } catch { return null; } }
      if(url.protocol!=='https:' || !url.hostname || url.username || url.password || url.port) return null;
      const originalHost=url.hostname.toLowerCase();
      const host=originalHost.replace(/^www\./,'');
      if(!host.includes('.') || host==='localhost' || host.endsWith('.localhost') || /^\d+(\.\d+){3}$/.test(host) || host.includes(':')) return null;
      url.hash=''; return {url:url.origin+url.pathname.replace(/\/$/,'')+(url.search||''),host,name:host.split('.').slice(-2).join('.'),category:'Family approved',mark:host[0].toUpperCase()};
    }
    function allowedSite(site) { return state.controls.allowedSites.some(s=>s.host===site.host || site.host.endsWith('.'+s.host)); }
    async function handleSubmit(event) {
      event.preventDefault(); const form=event.target; const type=form.dataset.form;
      if(type==='setup-device') return setupForm(form,'device');
      if(type==='setup-parent') return setupForm(form,'parent');
      if(type==='unlock') {
        const pin=String(new FormData(form).get('pin')||'');
        if(!validPin(pin) || !(await verifyPin(pin,state.devicePin))) { lockError='That PIN did not match. Try again.'; render(); return; }
        unlocked=true; unlockedPinValue=pin; lockError=''; view='home'; updateUsageDay(); render(); return;
      }
      if(type==='parent-gate') {
        const pin=String(new FormData(form).get('pin')||'');
        if(!validPin(pin) || !(await verifyPin(pin,state.parentPin))) { parentError='That code did not match. Try again.'; render(); return; }
        parentMode=true; modal=null; parentError=''; settingsTab='safety'; view='settings'; render(); return;
      }
      if(type==='browser-search') {
        const q=String(new FormData(form).get('query')||'').trim().toLowerCase();
        if(!q) return;
        const found=state.controls.allowedSites.find(s=>s.name.toLowerCase().includes(q)||s.host.toLowerCase().includes(q)||String(s.category||'').toLowerCase().includes(q));
        if(found) { currentBrowserSite={...found}; render(); }
        else if(!state.controls.blockUnknownSites) {
          const direct=normalizeSiteUrl(q);
          if(direct) { currentBrowserSite=direct; render(); }
          else showToast('Enter a full HTTPS website address.');
        } else showToast('No matching approved starting point. Ask a parent to review the site.');
        return;
      }
      if(type==='journal-save') { state.journal=String(new FormData(form).get('journal')||'').slice(0,4000); persist(); showToast('Your note was saved on this device.'); return; }
      if(type==='add-site') {
        const value=String(new FormData(form).get('url')||''); const site=normalizeSiteUrl(value); const err=$('#site-error');
        if(!site) { if(err) err.textContent='Enter a valid HTTPS website address (no local or private IP addresses).'; return; }
        if(state.controls.allowedSites.some(s=>s.host===site.host)) { if(err) err.textContent='That website is already on the approved list.'; return; }
        if(!confirm(`Have you reviewed ${site.host} and decided it is appropriate for this child?`)) return;
        state.controls.allowedSites.push(site); persist(); showToast('Approved starting point added.'); render(); return;
      }
      if(type==='change-device-pin') {
        const d=new FormData(form), parent=String(d.get('parent')||''), pin=String(d.get('pin')||''), confirm=String(d.get('confirm')||''), err=$('#change-device-error');
        if(!(await verifyPin(parent,state.parentPin))) { if(err) err.textContent='The parental code was not correct.'; return; }
        if(!validPin(pin)) { if(err) err.textContent='The new PIN must be 4–10 digits.'; return; }
        if(pin!==confirm) { if(err) err.textContent='The new PIN entries do not match.'; return; }
        if(pin===parent) { if(err) err.textContent='The unlock PIN and parental code must be different.'; return; }
        state.devicePin=await makePinRecord(pin); unlockedPinValue=pin; persist(); showToast('Safe Screen unlock PIN updated.'); render(); return;
      }
      if(type==='change-parent-pin') {
        const d=new FormData(form), device=String(d.get('device')||''), pin=String(d.get('pin')||''), confirm=String(d.get('confirm')||''), err=$('#change-parent-error');
        if(!(await verifyPin(device,state.devicePin))) { if(err) err.textContent='The Safe Screen unlock PIN was not correct.'; return; }
        if(!validPin(pin)) { if(err) err.textContent='The new code must be 4–10 digits.'; return; }
        if(pin!==confirm) { if(err) err.textContent='The new code entries do not match.'; return; }
        if(pin===device || pin===unlockedPinValue) { if(err) err.textContent='The parental code must be different from the unlock PIN.'; return; }
        state.parentPin=await makePinRecord(pin); persist(); showToast('Parental code updated.'); render(); return;
      }
    }
    function doCalc(key) {
      const current=Number(calc.display);
      if(key==='C') { calc={display:'0',stored:null,operator:null,resetNext:false,expression:''}; }
      else if(key==='⌫') { calc.display=calc.display.length>1?calc.display.slice(0,-1):'0'; if(calc.display==='-') calc.display='0'; }
      else if(key==='±') { calc.display=String(-current); }
      else if(key==='%') { calc.display=String(current/100); }
      else if(['÷','×','−','+'].includes(key)) { calc.stored=current; calc.operator=key; calc.expression=`${calc.display} ${key}`; calc.resetNext=true; }
      else if(key==='=') {
        if(calc.stored!==null && calc.operator) {
          const a=calc.stored,b=current; let result=0;
          if(calc.operator==='+') result=a+b; if(calc.operator==='−') result=a-b; if(calc.operator==='×') result=a*b; if(calc.operator==='÷') result=b===0?NaN:a/b;
          calc.expression=`${a} ${calc.operator} ${b} =`; calc.display=Number.isFinite(result)?String(Number(result.toPrecision(10))):'Not possible'; calc.stored=null; calc.operator=null; calc.resetNext=true;
        }
      } else if(key==='.') { if(calc.resetNext){calc.display='0.';calc.resetNext=false;} else if(!calc.display.includes('.'))calc.display+='.'; }
      else if(/^\d$/.test(key)) { if(calc.resetNext || calc.display==='0' || calc.display==='Not possible'){calc.display=key;calc.resetNext=false;} else if(calc.display.length<14)calc.display+=key; }
      render();
    }
    function handleClick(event) {
      const btn=event.target.closest('[data-action]'); if(!btn) return;
      const action=btn.dataset.action;
      if(action==='setup-next') { if(setupStage===0) setupStage=1; else if(setupStage===1) setupStage=2; else if(setupStage===4) setupStage=5; render(); }
      else if(action==='choose-theme') { setupDraft.theme=btn.dataset.value; render(); }
      else if(action==='toggle-setup-time') { setupDraft.timeLimitEnabled=!setupDraft.timeLimitEnabled; render(); }
      else if(action==='toggle-setup-bedtime') { setupDraft.bedtimeEnabled=!setupDraft.bedtimeEnabled; render(); }
      else if(action==='finish-setup') finishSetup();
      else if(action==='navigate') { if(!unlocked) return; navTo(btn.dataset.view); }
      else if(action==='launch-app') launchApp(btn.dataset.app);
      else if(action==='exit-parent') { parentMode=false; if(getLimitReason()) view='time-limit'; else view='home'; render(); }
      else if(action==='settings-tab') { settingsTab=btn.dataset.tab; render(); }
      else if(action==='close-modal') { modal=null; parentError=''; render(); }
      else if(action==='browser-open-site') { const site=state.controls.allowedSites[Number(btn.dataset.index)]; if(site) { currentBrowserSite={...site}; render(); } }
      else if(action==='browser-home') { currentBrowserSite=null; render(); }
      else if(action==='toggle-control') {
        const key=btn.dataset.key;
        if(key.startsWith('app:')) { const id=key.slice(4); state.controls.visibleApps[id]=!state.controls.visibleApps[id]; }
        else state.controls[key]=!state.controls[key];
        persist(); if(state.controls.timeLimitEnabled && getLimitReason() && !parentMode) view='time-limit'; render();
      }
      else if(action==='remove-site') { const index=Number(btn.dataset.index); if(index>=0&&index<state.controls.allowedSites.length) { state.controls.allowedSites.splice(index,1); if(currentBrowserSite && currentBrowserSite.host===state.controls.allowedSites[index]?.host) currentBrowserSite=null; persist(); render(); } }
      else if(action==='reset-usage') { state.usage={date:todayKey(),seconds:0}; persist(); showToast('Demo usage reset.'); render(); }
      else if(action==='reset-prototype') { modal='reset-confirm'; render(); }
      else if(action==='confirm-reset') { localStorage.removeItem(STORAGE_KEY); state=makeDefaultState(); setupStage=0; setupDraft={theme:'system',devicePin:'',parentPin:'',timeLimitEnabled:true,dailyLimitMinutes:120,bedtimeEnabled:false}; unlocked=false; parentMode=false; unlockedPinValue=''; view='setup'; modal=null; currentBrowserSite=null; persist(); render(); }
      else if(action==='ask-parent') { modal='parent-gate'; parentError=''; render(); }
      else if(action==='leave-overlay') showToast('On iPhone, close this web app using the system gesture.');
      else if(action==='lesson-topic') { lessonTopic=btn.dataset.topic; render(); }
      else if(action==='lesson-answer') { const text=Number(btn.dataset.index)===Number(btn.dataset.correct)?'That is right — nice thinking!':'Not quite. Have another look at the lesson, then try again.'; const feedback=$('#lesson-feedback'); if(feedback) feedback.textContent=text; $$('.lesson-card + .card [data-action="lesson-answer"]').forEach(b=>b.disabled=true); btn.style.borderColor='var(--accent)'; }
      else if(action==='calc-key') doCalc(btn.dataset.key);
      else if(action==='clear-journal') { state.journal=''; persist(); render(); showToast('Journal cleared on this device.'); }
    }
    function handleChange(event) {
      const el=event.target;
      if(el.dataset.action==='setup-limit-change') { setupDraft.dailyLimitMinutes=Number(el.value); const lab=$('#setup-limit-label'); if(lab)lab.textContent=el.value+' minutes'; return; }
      if(el.dataset.action==='limit-change') { state.controls.dailyLimitMinutes=Number(el.value); persist(); const lab=$('#daily-limit-label'); if(lab)lab.textContent=el.value+' minutes'; const fill=$('.progress-fill'); if(fill)fill.style.width=progressPercent()+'%'; if(getLimitReason()&&!parentMode){view='time-limit';render();} return; }
      if(el.dataset.setting==='theme') { state.theme=el.value; persist(); render(); return; }
      if(el.dataset.setting==='bedtimeStart'||el.dataset.setting==='bedtimeEnd') { state.controls[el.dataset.setting]=el.value; persist(); render(); return; }
    }
    root.addEventListener('click', handleClick);
    root.addEventListener('submit', handleSubmit);
    root.addEventListener('change', handleChange);
    root.addEventListener('input', event=>{ const el=event.target; if(el.id==='setup-limit') { setupDraft.dailyLimitMinutes=Number(el.value); const lab=$('#setup-limit-label'); if(lab)lab.textContent=el.value+' minutes'; } });
    document.addEventListener('keydown', event=>{ if(event.key==='Escape' && modal){modal=null;render();} });

    // Usage tracking is deliberately scoped to the visible Safe Screen web app, not iOS-wide usage.
    setInterval(()=>{
      if(!unlocked || !state.setupDone || parentMode || document.visibilityState!=='visible' || view==='settings' || view==='lock' || view==='setup') return;
      updateUsageDay(); state.usage.seconds += 1;
      if(state.usage.seconds % 15 === 0) { persist(); const val=$('#usage-value'); if(val)val.textContent=formatTime(state.usage.seconds); const fill=$('#usage-progress'); if(fill)fill.style.width=progressPercent()+'%'; }
      const reason=getLimitReason(); if(reason && view!=='time-limit') render();
    },1000);

    if('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }
    render();
  })();
  </script>
</body>
